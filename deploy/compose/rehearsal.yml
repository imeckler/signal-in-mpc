# LOCAL two-node rehearsal on one machine: both computation nodes as containers on a private
# Docker network, against the LOCAL Signal-Server and the five LOCAL database nodes of
# local_signal_server/ running on the host (reached as host.docker.internal). Never against
# Signal's service. Driven by deploy/scripts/rehearsal.py, which writes the per-node
# configurations, secrets and rehearsal.env under its work directory and starts/stops the host
# side (server, database nodes) with local_signal_server's own scripts.
#
#   docker compose -f deploy/compose/rehearsal.yml --env-file WORK/rehearsal.env up -d
#
# TEST SET-UP: the account comes from the local export (scaffolding), both workers' certificates
# are made by bench_certs.sh on this machine, there is no WireGuard (a private bridge network
# stands in for it). STATUS: see DEPLOYMENT.md, "Status of this tooling".
name: tls-mpc-rehearsal

x-node: &node
  image: ${IMAGE:-tls-mpc-node:malicious}
  command: ["daemon"]
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &node-env
    TLS_MPC_REHEARSAL: "1"                      # EXPECTED_MANIFEST_SHA256 not required (it is still checked if set)
    TLS_MPC_HOST_ALIAS: host.docker.internal    # loopback addresses in the config -> the host
    EXPECTED_MANIFEST_SHA256: ${EXPECTED_MANIFEST_SHA256:-}
    EXPECTED_WORD_DIR_SHA256: ${EXPECTED_WORD_DIR_SHA256:-}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: ${NODE_MEMORY:-12g}

services:
  node-a:
    <<: *node
    networks:
      mpc:
        ipv4_address: 172.29.0.10
    ports:
      - "127.0.0.1:19700:19700"                 # the application's listener (notify-app on the host)
    volumes:
      - ${REHEARSAL_DIR}/node-a/config:/srv/tls-mpc/config:ro
      - ${REHEARSAL_DIR}/node-a/secrets:/srv/tls-mpc/secrets:ro
      - ${REHEARSAL_DIR}/node-a/state:/srv/tls-mpc/state
      - ${REHEARSAL_DIR}/shared:/srv/tls-mpc/shared:ro
      - ${CIRCUITS_DIR}:/srv/tls-mpc/circuits:ro
      - ${WORD_DIR}:/opt/tls-mpc/word:ro

  node-b:
    <<: *node
    networks:
      mpc:
        ipv4_address: 172.29.0.11
    ports:
      - "127.0.0.1:19701:19701"
    volumes:
      - ${REHEARSAL_DIR}/node-b/config:/srv/tls-mpc/config:ro
      - ${REHEARSAL_DIR}/node-b/secrets:/srv/tls-mpc/secrets:ro
      - ${REHEARSAL_DIR}/node-b/state:/srv/tls-mpc/state
      - ${REHEARSAL_DIR}/shared:/srv/tls-mpc/shared:ro
      - ${CIRCUITS_DIR}:/srv/tls-mpc/circuits:ro
      - ${WORD_DIR}:/opt/tls-mpc/word:ro

networks:
  mpc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
