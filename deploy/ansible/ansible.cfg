[defaults]
host_key_checking = False
forks = 12
timeout = 30
interpreter_python = /usr/bin/python3
roles_path = /deploy/ansible/roles
retry_files_enabled = False
nocolor = True
display_skipped_hosts = False

[ssh_connection]
pipelining = True
# Host keys: each host's ansible_ssh_common_args (written by deploy.py) pins them on first use
# (StrictHostKeyChecking=accept-new, /state/ssh/known_hosts); local test machines, which get new
# host keys whenever they are recreated, are not pinned.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
