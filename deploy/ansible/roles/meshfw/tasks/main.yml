# Service ports, on the tunnel interface only, each from the peers that need it
# (DEPLOYMENT.md "Ports and firewall"). Everything else stays closed (the field engine and the
# database server bind every interface: this is what closes them).
- name: Tunnel rules
  community.general.ufw:
    rule: allow
    interface: wg0
    direction: in
    from_ip: "{{ item.src }}"
    to_port: "{{ item.port }}"
    proto: tcp
    comment: "tls-mpc {{ item.why }}"
  loop: "{{ me.rules }}"

- name: The monitoring page from the allowed addresses (only if monitoring_allow_ips is set)
  community.general.ufw:
    rule: allow
    port: "8088"
    proto: tcp
    from_ip: "{{ item }}"
    comment: tls-mpc monitoring page
  loop: "{{ monitoring_allow_ips if me.health.page_public else [] }}"
