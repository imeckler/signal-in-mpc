# Default deny: only ssh (from the administrators) and WireGuard are open on the public side.
# Every service port is opened later (start), on the tunnel interface only, per sender.
- name: Who is connecting (the administrator's address as this machine sees it)
  ansible.builtin.set_fact:
    ssh_client: "{{ (ansible_env.SSH_CLIENT | default('')).split(' ') | first }}"

- name: Allow ssh from the administrators
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
    comment: tls-mpc admin ssh
  loop: "{{ (admin_cidrs + ([ssh_client] if ssh_client else [])) | unique }}"

- name: WireGuard from anywhere (it answers only to known keys)
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    comment: tls-mpc wireguard

- name: Deny everything else coming in
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow going out
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Firewall on
  community.general.ufw:
    state: enabled
