[package]
name = "real-signal-register"
version = "0.1.0"
edition = "2021"

# A conventional registration client for the REAL Signal service, built on the same libsignal
# revision and connection code as secret-shared-db's relay-node (whose Cargo.lock is copied here
# so the same sources are used). It is not part of the two-party client.

[dependencies]
libsignal-core = { git = "https://github.com/imeckler/libsignal.git" }
libsignal-net = { git = "https://github.com/imeckler/libsignal.git" }
libsignal-net-chat = { git = "https://github.com/imeckler/libsignal.git" }
libsignal-protocol = { git = "https://github.com/imeckler/libsignal.git" }
zkgroup = { git = "https://github.com/imeckler/libsignal.git" }
usernames = { git = "https://github.com/imeckler/libsignal.git" }
http = "1.3.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = ["std"] }
base64 = "0.21"
rand = "0.9.2"
rand_core = "0.9.3"
futures-util = "0.3"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
boring = { git = 'https://github.com/signalapp/boring', tag = 'signal-v4.18.0' }
boring-sys = { git = 'https://github.com/signalapp/boring', tag = 'signal-v4.18.0' }
tungstenite = { git = 'https://github.com/signalapp/tungstenite-rs', tag = 'signal-v0.27.0' }

[workspace]
